name: Build and Deploy Arch Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Fast static checks (shell formatting, python types, unit tests) that gate
  # the build layers: a lint failure costs seconds here instead of build
  # minutes down the line.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install tools
        env:
          SHFMT_VERSION: "3.13.1"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod +x "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run checks
        run: ./lint.sh

  # Parse all PKGBUILDs, compute the dependency layers and hand each layer to
  # the matching build-N job below as a matrix. Layers are computed per run,
  # they do not need to be maintained by hand.
  layers:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      level0: ${{ steps.layers.outputs.level0 }}
      level1: ${{ steps.layers.outputs.level1 }}
      level2: ${{ steps.layers.outputs.level2 }}
      level3: ${{ steps.layers.outputs.level3 }}
      level4: ${{ steps.layers.outputs.level4 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate signing configuration
        run: ./build.sh --check

      - name: Compute dependency layers
        id: layers
        run: python3 layers.py

  # Each level builds concurrently; a level-N job downloads the artifacts of
  # all previous levels into repo/ so dependencies resolve against them via
  # the local file:// repository.
  build-0:
    name: build L0 ${{ matrix.name }}
    needs: layers
    if: ${{ needs.layers.outputs.level0 != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.layers.outputs.level0) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download packages from previous layers
        if: ${{ matrix.level > 0 }}
        uses: actions/download-artifact@v4
        with:
          pattern: instantpkg-*
          merge-multiple: true
          path: repo

      - name: Build package
        run: ./build.sh "${{ matrix.path }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: instantpkg-${{ matrix.name }}
          path: repo/${{ matrix.name }}-*.pkg.tar.zst*
          if-no-files-found: error

  build-1:
    name: build L1 ${{ matrix.name }}
    needs: [layers, build-0]
    if: ${{ needs.layers.outputs.level1 != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.layers.outputs.level1) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download packages from previous layers
        if: ${{ matrix.level > 0 }}
        uses: actions/download-artifact@v4
        with:
          pattern: instantpkg-*
          merge-multiple: true
          path: repo

      - name: Build package
        run: ./build.sh "${{ matrix.path }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: instantpkg-${{ matrix.name }}
          path: repo/${{ matrix.name }}-*.pkg.tar.zst*
          if-no-files-found: error

  build-2:
    name: build L2 ${{ matrix.name }}
    needs: [layers, build-1]
    if: ${{ needs.layers.outputs.level2 != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.layers.outputs.level2) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download packages from previous layers
        if: ${{ matrix.level > 0 }}
        uses: actions/download-artifact@v4
        with:
          pattern: instantpkg-*
          merge-multiple: true
          path: repo

      - name: Build package
        run: ./build.sh "${{ matrix.path }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: instantpkg-${{ matrix.name }}
          path: repo/${{ matrix.name }}-*.pkg.tar.zst*
          if-no-files-found: error

  build-3:
    name: build L3 ${{ matrix.name }}
    needs: [layers, build-2]
    if: ${{ needs.layers.outputs.level3 != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.layers.outputs.level3) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download packages from previous layers
        if: ${{ matrix.level > 0 }}
        uses: actions/download-artifact@v4
        with:
          pattern: instantpkg-*
          merge-multiple: true
          path: repo

      - name: Build package
        run: ./build.sh "${{ matrix.path }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: instantpkg-${{ matrix.name }}
          path: repo/${{ matrix.name }}-*.pkg.tar.zst*
          if-no-files-found: error

  build-4:
    name: build L4 ${{ matrix.name }}
    needs: [layers, build-3]
    if: ${{ needs.layers.outputs.level4 != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.layers.outputs.level4) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download packages from previous layers
        if: ${{ matrix.level > 0 }}
        uses: actions/download-artifact@v4
        with:
          pattern: instantpkg-*
          merge-multiple: true
          path: repo

      - name: Build package
        run: ./build.sh "${{ matrix.path }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: instantpkg-${{ matrix.name }}
          path: repo/${{ matrix.name }}-*.pkg.tar.zst*
          if-no-files-found: error

  # Concatenate all build artifacts into the final repository database.
  # Runs unless a build job actually failed; empty layers skip their build
  # job, which must not block assembly.
  assemble:
    needs: [build-0, build-1, build-2, build-3, build-4]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          pattern: instantpkg-*
          merge-multiple: true
          path: repo

      - name: Assemble repository database
        env:
          # Only this isolated signing step receives the secret key.
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEYID: ${{ vars.GPG_KEYID }}
        run: ./assemble.sh

      - name: Generate Directory Listing
        uses: gacts/directory-listing@v1
        with:
          target: ./repo
          show-hidden: false
          overwrite: true

      - name: Deploy to Surge.sh
        uses: dswistowski/surge-sh-action@v1
        with:
          domain: 'instantos.surge.sh'
          project: './repo'
          login: ${{ secrets.SURGE_LOGIN }}
          token: ${{ secrets.SURGE_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./repo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
